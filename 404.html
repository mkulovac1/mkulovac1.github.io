    <style>
        :root {
            --text: #f5f7fb;
            --muted: #9aa4bd;
            --cyan: #12f7ff;
            --violet: #b06bff;
            --bg: #06070c;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --redirect-seconds: 8s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", system-ui, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #warp {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .glow {
            position: fixed;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .22;
            pointer-events: none;
            animation: drift 18s ease-in-out infinite alternate;
        }
        .glow.a { background: var(--cyan); top: -25vmax; left: -20vmax; }
        .glow.b { background: var(--violet); bottom: -30vmax; right: -20vmax; animation-delay: -9s; }

        @keyframes drift {
            to { transform: translate(8vmax, 6vmax) scale(1.15); }
        }

        main {
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            text-align: center;
        }

        .card {
            width: min(100%, 560px);
            padding: 48px 32px 40px;
            border-radius: 28px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
            animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
            transition: transform .9s cubic-bezier(.7, 0, .3, 1), opacity .7s ease, filter .7s ease;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(30px) scale(.96); filter: blur(8px); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 7px 16px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: rgba(18, 247, 255, .06);
            color: var(--muted);
            font-size: .82rem;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 0 0 rgba(18, 247, 255, .7);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            70% { box-shadow: 0 0 0 10px rgba(18, 247, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(18, 247, 255, 0); }
        }

        h1 {
            margin: 26px 0 12px;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: clamp(2rem, 7vw, 3.1rem);
            line-height: 1.08;
            letter-spacing: -.02em;
        }

        .domain {
            display: block;
            margin-top: 6px;
            background: linear-gradient(100deg, var(--cyan), var(--violet), var(--cyan));
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 4s linear infinite;
            min-height: 1.1em;
        }

        .domain .caret {
            display: inline-block;
            width: 3px;
            height: .9em;
            margin-left: 4px;
            vertical-align: -0.08em;
            background: var(--cyan);
            animation: blink 1s steps(1) infinite;
        }

        @keyframes shimmer { to { background-position: -200% 0; } }
        @keyframes blink { 50% { opacity: 0; } }

        p.lead {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.65;
            max-width: 40ch;
            margin: 0 auto 32px;
        }

        .cta {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 8px 8px 8px 26px;
            border-radius: 999px;
            background: var(--cyan);
            color: #031014;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            text-decoration: none;
            box-shadow: 0 0 0 0 rgba(18, 247, 255, .4), 0 10px 40px rgba(18, 247, 255, .35);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .cta:hover, .cta:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 0 0 6px rgba(18, 247, 255, .15), 0 14px 50px rgba(18, 247, 255, .5);
            outline: none;
        }

        .ring {
            position: relative;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #031014;
            color: var(--cyan);
        }

        .ring svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .ring circle {
            fill: none;
            stroke: var(--cyan);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 126;
            stroke-dashoffset: 0;
            animation: countdown var(--redirect-seconds) linear forwards;
        }

        .ring .arrow {
            position: static;
            transform: none;
            transition: transform .25s ease;
        }
        .cta:hover .arrow { transform: translateX(3px); }

        @keyframes countdown { to { stroke-dashoffset: 126; } }

        .timer {
            margin-top: 22px;
            font-size: .88rem;
            color: var(--muted);
        }

        .timer button {
            background: none;
            border: 0;
            color: var(--text);
            font: inherit;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .timer.paused .count-text { display: none; }
        .timer:not(.paused) .paused-text { display: none; }
        .paused-ring circle { animation-play-state: paused; }

        .socials {
            margin-top: 34px;
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .socials a {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--muted);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            transition: color .25s ease, transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
            animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both;
        }
        .socials a:nth-child(1) { animation-delay: 1.1s; }
        .socials a:nth-child(2) { animation-delay: 1.2s; }
        .socials a:nth-child(3) { animation-delay: 1.3s; }
        .socials a:nth-child(4) { animation-delay: 1.4s; }

        .socials svg { width: 19px; height: 19px; }

        .socials a:hover, .socials a:focus-visible {
            color: var(--cyan);
            background: rgba(18, 247, 255, .08);
            border-color: rgba(18, 247, 255, .45);
            box-shadow: 0 0 22px rgba(18, 247, 255, .3);
            transform: translateY(-4px);
            outline: none;
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(12px) scale(.6); }
        }

        body.leaving .card {
            transform: scale(.6) translateZ(0);
            opacity: 0;
            filter: blur(10px);
        }

        @media (max-width: 420px) {
            .card { padding: 40px 20px 32px; border-radius: 22px; }
            .socials { gap: 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
            .ring circle { animation: none; }
        }
    </style>

    <script>
        (function () {
            var TARGET = 'https://merim.dev/';
            var SECONDS = 8;
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            var canvas = document.getElementById('warp');
            var ctx = canvas.getContext('2d');
            var stars = [];
            var speed = 0.6;
            var targetSpeed = 0.6;
            var w, h, cx, cy, dpr;

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = canvas.clientWidth;
                h = canvas.clientHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                cx = w / 2;
                cy = h / 2;
            }

            function makeStar() {
                return { x: (Math.random() - .5) * w * 2, y: (Math.random() - .5) * h * 2, z: Math.random() * w, pz: 0 };
            }

            resize();
            var count = Math.min(500, Math.floor((w * h) / 2600));
            for (var i = 0; i < count; i++) stars.push(makeStar());
            window.addEventListener('resize', resize);

            function frame() {
                speed += (targetSpeed - speed) * 0.06;
                ctx.fillStyle = 'rgba(6, 7, 12, ' + (speed > 4 ? 0.25 : 0.6) + ')';
                ctx.fillRect(0, 0, w, h);

                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    s.pz = s.z;
                    s.z -= speed;
                    if (s.z < 1) {
                        stars[i] = makeStar();
                        stars[i].z = w;
                        continue;
                    }
                    var k = 128 / s.z, pk = 128 / s.pz;
                    var x = s.x * k + cx, y = s.y * k + cy;
                    var px = s.x * pk + cx, py = s.y * pk + cy;
                    var t = 1 - s.z / w;
                    ctx.strokeStyle = t > .7 ? 'rgba(18, 247, 255,' + t + ')' : 'rgba(200, 210, 255,' + t + ')';
                    ctx.lineWidth = Math.max(.5, t * 2.2);
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
                requestAnimationFrame(frame);
            }

            if (!reduceMotion) requestAnimationFrame(frame);

            var typed = document.getElementById('typed');
            if (!reduceMotion) {
                var word = typed.textContent;
                typed.textContent = '';
                var n = 0;
                setTimeout(function type() {
                    typed.textContent = word.slice(0, ++n);
                    if (n < word.length) setTimeout(type, 90 + Math.random() * 70);
                }, 700);
            }

            var left = SECONDS;
            var countEl = document.getElementById('count');
            var timerEl = document.getElementById('timer');
            var ring = document.getElementById('ring');
            var leaving = false;

            function leave() {
                if (leaving) return;
                leaving = true;
                if (reduceMotion) { location.replace(TARGET); return; }
                targetSpeed = 40;
                document.body.classList.add('leaving');
                setTimeout(function () { location.replace(TARGET); }, 900);
            }

            var tick = setInterval(function () {
                left -= 1;
                countEl.textContent = left;
                if (left <= 0) {
                    clearInterval(tick);
                    leave();
                }
            }, 1000);

            document.getElementById('stay').addEventListener('click', function () {
                clearInterval(tick);
                timerEl.classList.add('paused');
                ring.classList.add('paused-ring');
            });

            document.getElementById('go').addEventListener('click', function (e) {
                if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
                e.preventDefault();
                clearInterval(tick);
                leave();
            });
        })();
    </script>
